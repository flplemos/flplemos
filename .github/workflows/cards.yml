name: Atualizar cards do perfil

on:
  schedule:
    - cron: "0 6 * * *" # todo dia, 03:00 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/generate_cards.py, .github/workflows/cards.yml]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar stats.svg e languages.svg
        run: python scripts/generate_cards.py ${{ github.repository_owner }}
        env:
          # Se quiser contar contribuições privadas, crie um PAT e salve como secret CARDS_TOKEN.
          GITHUB_TOKEN: ${{ secrets.CARDS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/languages.svg
          git diff --cached --quiet || git commit -m "chore: atualiza cards do perfil"
          git push
