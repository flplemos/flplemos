name: Snake de contribuições

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # cores do portfolio: fundo #020617, verde #22C55E, cobra azul #38BDF8
          outputs: |
            dist/snake.svg?color_snake=#38BDF8&color_dots=#0E1223,#14532D,#15803D,#16A34A,#22C55E&color_dot_border=#020617

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
